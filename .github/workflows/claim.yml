name: CODM Daily Gift

on:
  schedule:
    # Three attempts inside the 6-7 AM IST window (times are UTC):
    # 00:37 UTC = 06:07 AM IST, 00:53 UTC = 06:23 AM IST, 01:11 UTC = 06:41 AM IST.
    # Extra runs are harmless: the script reports "already claimed" if an earlier run got it.
    - cron: "17 6 * * *"
    - cron: "12 6 * * *"
    - cron: "7 6 * * *"
  workflow_dispatch:   # lets you run it manually for testing

jobs:
  claim:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Claim gift
        run: node claim.js
        env:
          PLAYER_ID: ${{ secrets.CODM_PLAYER_ID }}

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: fail-*.png

      - name: Telegram alert on failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="❌ CODM daily gift claim FAILED. Check: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
